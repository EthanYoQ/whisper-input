name: Hotkey regression

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows-hotkey:
    name: Windows hotkey regression
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Use stable MSVC Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run hotkey regression tests
        timeout-minutes: 12
        run: npm run check:hotkey-injection

  application-regression:
    name: Application regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: rustup update stable
      - run: npm ci
      - run: npm run build
      - run: npm run test:frontend
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
