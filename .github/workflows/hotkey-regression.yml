name: Hotkey regression

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-promotion-regression:
    name: Release promotion retry regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-release-promotion-retry.sh

  windows-hotkey:
    name: Windows hotkey regression
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Use stable MSVC Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run hotkey regression tests
        timeout-minutes: 12
        run: npm run check:hotkey-injection

  application-regression:
    name: Application regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: rustup update stable
      - run: npm ci
      - run: npm run build
      - run: npm run test:frontend
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Run application Rust unit tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1
      - name: Run application Rust unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Tauri embeds Common Controls v6 in app binaries but not lib unit-test binaries.
          $manifest = Join-Path $env:RUNNER_TEMP 'comctl-v6-test.xml'
          $xml = '<assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><dependency><dependentAssembly><assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/></dependentAssembly></dependency></assembly>'
          [System.IO.File]::WriteAllText($manifest, $xml)
          $tests = @(Get-ChildItem 'src-tauri/target/debug/deps' -Filter 'openless_lib-*.exe')
          if ($tests.Count -ne 1) { throw "Expected one lib test executable, found $($tests.Count)" }
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter mt.exe -Recurse |
            Where-Object { $_.FullName.EndsWith('\x64\mt.exe') } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK mt.exe not found' }
          & $mt.FullName -manifest $manifest "-outputresource:$($tests[0].FullName);#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $tests[0].FullName --test-threads=1
          exit $LASTEXITCODE
