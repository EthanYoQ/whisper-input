name: Build macOS release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的已有版本标签，例如 v1.3.34
        required: true
        type: string

# 该工作流只产出待验收的 macOS 资产。统一发布由
# release-promotion.yml 在 macOS 与 Windows 均合格后执行。
permissions:
  contents: read

jobs:
  build:
    name: Build macOS arm64 installer
    runs-on: macos-14
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      TARGET: aarch64-apple-darwin
      ARCH: arm64

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$RELEASE_TAG"
          test "$(git rev-parse --verify HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the macOS DMG
        run: npm run tauri build -- --target "$TARGET"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          dmg_dir="src-tauri/target/${TARGET}/release/bundle/dmg"
          dmg="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          if [ -z "$dmg" ]; then
            echo "No DMG was produced in $dmg_dir" >&2
            exit 1
          fi

          mkdir -p release-assets
          asset="Whisper_Input_${version}_${ARCH}.dmg"
          cp "$dmg" "release-assets/$asset"
          (
            cd release-assets
            shasum -a 256 "$asset" > "$asset.sha256"
          )

      - name: Upload macOS release assets for promotion
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-${{ env.RELEASE_TAG }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
